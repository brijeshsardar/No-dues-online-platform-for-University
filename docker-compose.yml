version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${PORT:-5000}:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - CLIENT_URL=${CLIENT_URL:-http://localhost:5173}
      - DATABASE_URL=file:./dev.db
      - JWT_SECRET=${JWT_SECRET:-ct_university_super_secure_jwt_secret_key_2026}
      - JWT_EXPIRES_IN=2h
      - SESSION_SECRET=${SESSION_SECRET:-ct_session_secure_entropy_key_7781293}
      - COOKIE_SECRET=${COOKIE_SECRET:-ct_cookie_secret_991823}
      - MFA_APP_NAME="CT University Clearance"
      - VERIFY_BASE_URL=${VERIFY_BASE_URL:-http://localhost:5173/verify}
      - SIGNING_KEY_PASSPHRASE=ct_uni_exam_clearance_sign_key_pass_2026
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=ct_university_nodues
    volumes:
      - backend-data:/app/prisma

volumes:
  backend-data:
