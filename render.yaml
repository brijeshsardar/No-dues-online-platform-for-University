services:
  - type: web
    name: ct-university-nodues-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npm run build
    startCommand: npx prisma db push --skip-generate && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: CLIENT_URL
        value: https://no-dues-online-platform-for-university.vercel.app
      - key: DATABASE_URL
        value: "file:./dev.db"
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 2h
      - key: SESSION_SECRET
        generateValue: true
      - key: COOKIE_SECRET
        generateValue: true
      - key: MFA_APP_NAME
        value: "CT University Clearance"
      - key: VERIFY_BASE_URL
        value: https://no-dues-online-platform-for-university.vercel.app/verify
      - key: SIGNING_KEY_PASSPHRASE
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: ct_university_nodues
